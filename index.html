<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transduktor</title>
<meta name="description" content="Mealy- und Moore-Automaten zeichnen, animieren, prüfen, umwandeln und minimieren. Läuft komplett im Browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314171c'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%23fff' stroke-width='2.2'/%3E%3Crect x='2' y='9' width='7' height='3.5' fill='%237ba3ff'/%3E%3Crect x='23' y='19.5' width='7' height='3.5' fill='%23ff8d61'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,600;1,400;1,500&family=Fira+Mono:wght@400;500&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE   Werkzeug für die Schule: ruhig, präzise, schnell zu bedienen
   IDEA    ein Fernschreiber-Transduktor: Zeichenblatt in einem dunklen Rahmen, zwei Papierstreifen laufen durch den Lesekopf
   PICTURE der Automat selbst, groß auf dem Blatt, mit Token, das über die Kanten läuft
   COLOUR  Weißes Blatt, Tusche-Rahmen #14171c, Eingabe Kobalt #2457c5, Ausgabe Zinnober #d9441b (wie in der PDF-Übersicht)
   TYPE    Fira Sans für die Oberfläche, Crimson Pro kursiv für Zustandsnamen wie im Lehrbuch, Fira Mono für Bänder und Code
   LAYOUT  Laptop: Rahmen oben und links, Blatt in der Mitte, Panel rechts, Bänder unten. Handy: Blatt oben, Bänder unten, Panel als Blatt von unten */
:root{color-scheme:light dark;
  --frame:light-dark(#14171c,#0a0c10);--frame-ink:#e9edf3;--frame-mute:#8c95a4;--frame-hi:light-dark(#262b33,#1b2028);
  --paper:light-dark(#ffffff,#161a21);--chrome:light-dark(#ffffff,#1b2029);--sunk:light-dark(#f3f4f6,#12161c);
  --ink:light-dark(#14171c,#e8ecf2);--mute:light-dark(#5b6472,#9aa4b4);--rule:light-dark(#dde1e6,#2b323e);--dot:light-dark(#d3d8df,#2a313c);
  --in:light-dark(#2457c5,#7ba3ff);--out:light-dark(#d9441b,#ff8d61);--err:light-dark(#b0123e,#ff6b8f);--okc:light-dark(#18794e,#53d394);
  --in-soft:color-mix(in srgb,var(--in) 13%,transparent);--out-soft:color-mix(in srgb,var(--out) 14%,transparent);
  --sel:light-dark(#2457c5,#7ba3ff);
  --sans:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Fira Mono",ui-monospace,Menlo,Consolas,monospace;--serif:"Crimson Pro",Georgia,"Times New Roman",serif}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--frame);color:var(--ink);font:15px/1.45 var(--sans);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.st-name{font-family:var(--serif);font-style:italic;font-size:1.12em}
.st-name sub{font-size:.7em;font-style:normal}
.sym-i{color:var(--in);font-weight:500}
.sym-o{color:var(--out);font-weight:500}

/* ---------- Grundgerüst ---------- */
#app{height:100%;display:grid;grid-template-rows:52px minmax(0,1fr)}
header{display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;background:var(--frame);color:var(--frame-ink);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:9px;margin-right:10px;white-space:nowrap}
.brand b{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:-.01em}
.brand svg{flex:none}
.menus{display:flex;gap:2px}
.hbtn{background:none;border:0;color:var(--frame-ink);height:36px;padding:0 11px;border-radius:6px;font-size:14.5px;display:inline-flex;align-items:center;gap:7px}
.hbtn:hover,.hbtn[aria-expanded=true]{background:var(--frame-hi)}
.hbtn:disabled{opacity:.35;cursor:default;background:none}
.hbtn svg{width:18px;height:18px}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--frame-hi);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--frame-mute);height:30px;padding:0 12px;border-radius:6px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--frame-ink);color:var(--frame)}
.hdiv{width:1px;height:22px;background:var(--frame-hi);margin:0 4px}
.only-narrow{display:none}

.dd{position:absolute;top:46px;min-width:250px;background:var(--chrome);color:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:6px;box-shadow:0 18px 40px -12px rgba(0,0,0,.35);z-index:40}
.dd[hidden]{display:none}
.dd button{display:flex;width:100%;text-align:left;align-items:baseline;gap:10px;background:none;border:0;border-radius:6px;padding:8px 10px;font-size:14.5px}
.dd button:hover,.dd button:focus-visible{background:var(--sunk)}
.dd button small{margin-left:auto;color:var(--mute);font-size:12.5px;white-space:nowrap}
.dd .note{display:block;color:var(--mute);font-size:13px;margin-top:1px}
.dd .col{display:block}
.dd hr{border:0;border-top:1px solid var(--rule);margin:5px 4px}
.dd h4{margin:6px 10px 4px;font-size:12.5px;font-weight:500;color:var(--mute)}

main{display:grid;grid-template-columns:52px minmax(0,1fr) 376px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"tools canvas panel" "tools dock panel";min-height:0}
#tools{grid-area:tools;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;background:var(--frame)}
.tbtn{width:40px;height:40px;border:0;border-radius:8px;background:none;color:var(--frame-mute);display:grid;place-items:center;position:relative}
.tbtn svg{width:21px;height:21px}
.tbtn:hover{background:var(--frame-hi);color:var(--frame-ink)}
.tbtn[aria-pressed=true]{background:var(--frame-ink);color:var(--frame)}
.tbtn .k{position:absolute;right:3px;bottom:1px;font-size:9.5px;opacity:.7}
.tsep{width:24px;height:1px;background:var(--frame-hi);margin:6px 0}

/* ---------- Zeichenblatt ---------- */
#stage{grid-area:canvas;position:relative;background:var(--paper);overflow:hidden;border-top-left-radius:10px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
#cv.panning{cursor:grabbing}
#cv[data-tool=state]{cursor:copy}
#cv[data-tool=edge]{cursor:crosshair}
#cv[data-tool=delete]{cursor:not-allowed}
.grid-dot{fill:var(--dot)}
.st-c{fill:var(--paper);stroke:var(--ink);stroke-width:1.6}
.st-hit{fill:transparent}
.st-n{font-family:var(--serif);font-style:italic;font-size:21px;fill:var(--ink);text-anchor:middle;pointer-events:none}
.st-n .sub{font-style:normal;font-size:14px}
.st-o{font-family:var(--sans);font-weight:500;font-size:14px;fill:var(--out);text-anchor:middle;pointer-events:none}
.st-div{stroke:var(--rule);stroke-width:1.2}
.st-start{stroke:var(--ink);stroke-width:1.6;fill:none}
.st.sel .st-c{stroke:var(--ink);stroke-width:3.2}
.st.sel .st-ring{display:block}
.st-ring{display:none;fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:3 4;opacity:.55}
.st.pending .st-c{stroke:var(--in);stroke-dasharray:4 3;stroke-width:2.4}
.st.hot .st-c{fill:var(--in-soft);stroke:var(--in);stroke-width:2.8}
.st.err .st-c{stroke:var(--err);stroke-width:2.6}
.st.del:hover .st-c{stroke:var(--err)}
.knob{fill:var(--paper);stroke:var(--in);stroke-width:1.5;opacity:0;transition:opacity .12s;cursor:crosshair}
.knob-p{stroke:var(--in);stroke-width:1.6;pointer-events:none;opacity:0;transition:opacity .12s}
.st:hover .knob,.st:hover .knob-p,.st.sel .knob,.st.sel .knob-p{opacity:1}
#cv[data-tool=delete] .knob,#cv[data-tool=delete] .knob-p{display:none}
.ed-p{fill:none;stroke:var(--ink);stroke-width:1.5}
.ed-hit{fill:none;stroke:transparent;stroke-width:16}
.ed.sel .ed-p{stroke:var(--ink);stroke-width:2.8}
.ed.hot .ed-p{stroke:var(--in);stroke-width:2.6}
.ed.del:hover .ed-p{stroke:var(--err)}
.lb{cursor:grab}
.lb-bg{fill:var(--paper);stroke:none}
.ed.sel .lb-bg{fill:var(--paper);stroke:var(--ink);stroke-width:1.2;stroke-dasharray:3 3}
.lb-hot{fill:var(--in-soft)}
.lb text{font-family:var(--sans);font-size:15px;font-weight:500;text-anchor:middle;pointer-events:none}
.lb .i{fill:var(--in)}
.lb .o{fill:var(--out)}
.lb .s{fill:var(--mute);font-weight:400}
.lb .miss{fill:var(--err)}
#gO{pointer-events:none}
.ghost{stroke:var(--in);stroke-width:1.8;stroke-dasharray:6 5;fill:none}
.token{fill:var(--in);stroke:var(--paper);stroke-width:2.5}
.token-o{font:600 13px var(--sans);fill:var(--out);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:4px}

.fl{position:absolute;display:flex;gap:6px;z-index:5}
.fl-zoom{right:12px;bottom:12px;flex-direction:column;background:var(--chrome);border:1px solid var(--rule);border-radius:10px;padding:3px}
.fl-zoom button{width:38px;height:38px;border:0;background:none;border-radius:7px;display:grid;place-items:center;color:var(--ink)}
.fl-zoom button:hover{background:var(--sunk)}
.fl-zoom svg{width:19px;height:19px}
.chip-stat{left:12px;top:12px;background:var(--chrome);border:1px solid var(--rule);border-radius:999px;padding:6px 12px 6px 10px;font-size:13.5px;align-items:center;gap:8px;cursor:pointer}
.chip-stat i{width:9px;height:9px;border-radius:50%;background:var(--okc);flex:none}
.chip-stat.warn i{background:var(--out)}
.chip-stat.bad i{background:var(--err)}
.hint[hidden]{display:none}
.hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--mute);text-align:center;padding:24px}
.hint div{max-width:340px}
.hint b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;color:var(--ink);margin-bottom:4px}

/* Popover */
#pop{position:absolute;z-index:20;width:268px;background:var(--chrome);border:1px solid var(--rule);border-radius:12px;padding:12px;box-shadow:0 18px 44px -14px rgba(0,0,0,.4)}
#pop[hidden]{display:none}
#pop h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--mute);display:flex;align-items:center;justify-content:space-between}
#pop h3 button{border:0;background:none;color:var(--mute);width:28px;height:28px;border-radius:6px;font-size:18px;line-height:1}
.prow{display:flex;gap:6px;align-items:center;margin-bottom:7px}
.prow label{font-size:13px;color:var(--mute);width:64px;flex:none}
.inp{height:36px;border:1px solid var(--rule);border-radius:7px;background:var(--paper);padding:0 9px;font-size:16px;width:100%}
.inp.sm{height:32px;font-size:15px;padding:0 7px}
.inp.i{color:var(--in);font-weight:500}
.inp.o{color:var(--out);font-weight:500}
.inp:focus{border-color:var(--sel);outline:none;box-shadow:0 0 0 3px var(--in-soft)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr) 32px;gap:5px;align-items:center;margin-bottom:6px}
.lrow.moore{grid-template-columns:minmax(0,1fr) 32px}
.lrow .sl{color:var(--mute);text-align:center}
.x{width:32px;height:32px;border:0;background:none;border-radius:6px;color:var(--mute);font-size:18px}
.x:hover{background:var(--sunk);color:var(--err)}
.btn{height:36px;border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:0 12px;font-size:14.5px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.pri:hover{opacity:.9}
.btn.danger{color:var(--err)}
.btn.on{background:var(--in-soft);border-color:var(--in);color:var(--in)}
.btn svg{width:16px;height:16px}
.brow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* ---------- Panel ---------- */
#panel{grid-area:panel;background:var(--chrome);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--rule);overflow-x:auto;flex:none;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 10px 10px;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
.tabs .badge{min-width:18px;height:18px;border-radius:9px;background:var(--out);color:#fff;font-size:11.5px;display:inline-grid;place-items:center;padding:0 5px}
.tabs .badge.bad{background:var(--err)}
.tabs .badge.ok{background:var(--okc)}
.pbody{overflow:auto;padding:16px 16px 28px;flex:1}
.sheet-head{display:none}
.pbody h2{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.1;margin:0 0 4px;letter-spacing:-.01em}
.pbody h3{font-size:14px;font-weight:600;margin:20px 0 8px}
.pbody p{margin:0 0 10px}
.mut{color:var(--mute);font-size:13.5px}
.tuple{font-family:var(--serif);font-style:italic;font-size:26px;margin:6px 0 14px;white-space:nowrap;overflow-x:auto}
.tuple .p{font-style:normal}
.def{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 12px;align-items:start}
.def dt{font-family:var(--serif);font-style:italic;font-size:19px;line-height:30px;text-align:right}
.def dd{margin:0;min-height:30px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.def .fn{font-family:var(--serif);font-style:italic;font-size:17px}
.chip{display:inline-flex;align-items:center;gap:2px;height:28px;border-radius:14px;padding:0 4px 0 11px;font-weight:500;border:1px solid currentColor;background:none;font-size:14px}
.chip.i{color:var(--in);background:var(--in-soft);border-color:transparent}
.chip.o{color:var(--out);background:var(--out-soft);border-color:transparent}
.chip.decl{background:none;border:1px dashed currentColor}
.chip.q{color:var(--ink);background:var(--sunk);border-color:transparent;padding-right:11px}
.chip button{border:0;background:none;color:inherit;width:22px;height:22px;border-radius:11px;font-size:15px;line-height:1;opacity:.7}
.chip button:hover{opacity:1;background:color-mix(in srgb,currentColor 15%,transparent)}
.chip button:disabled{display:none}
.addsym{width:96px;height:28px;border:1px dashed var(--rule);border-radius:14px;background:none;padding:0 10px;font-size:14px}
.addsym:focus{border-style:solid;border-color:var(--sel);outline:none}
.fvals{font-family:var(--serif);font-size:16.5px;columns:2;column-gap:18px;margin:6px 0 0;padding:0;list-style:none}
.fvals li{break-inside:avoid;white-space:nowrap}
details.box{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin-top:14px}
details.box summary{cursor:pointer;font-weight:500;font-size:14px}
.tbl-wrap{overflow-x:auto;margin:0 -2px}
table.t{border-collapse:collapse;width:100%;font-size:14.5px}
table.t th{font-weight:500;font-size:13px;color:var(--mute);text-align:left;padding:6px 6px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.t td{padding:5px 6px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.t tr.cur td{background:var(--in-soft)}
table.t tr.stop td{background:color-mix(in srgb,var(--err) 10%,transparent)}
table.t th.c,table.t td.c{text-align:center}
.cell{display:flex;gap:4px;align-items:center;min-width:118px}
.cell select{height:32px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:0 4px;font-family:var(--serif);font-style:italic;font-size:16px;min-width:56px}
.cell select.empty{color:var(--err);border-color:color-mix(in srgb,var(--err) 50%,var(--rule))}
.cell .inp{width:54px}
.cell .warn{color:var(--err);font-size:12px}
.rowh{display:flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer}
.rowh .arr{color:var(--mute);font-size:13px;width:12px}
.code{width:100%;min-height:330px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:12px;font:14px/1.6 var(--mono);resize:vertical;tab-size:2;white-space:pre;overflow:auto}
.code:focus{outline:none;border-color:var(--sel);box-shadow:0 0 0 3px var(--in-soft)}
.errs{list-style:none;margin:8px 0 0;padding:0;font-size:13.5px;color:var(--err)}
.errs li{padding:3px 0}
.syntax{font:13px/1.6 var(--mono);background:var(--sunk);border-radius:8px;padding:10px 12px;white-space:pre-wrap;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 6px}
.stat{background:var(--sunk);border-radius:10px;padding:9px 10px}
.stat b{display:block;font-size:22px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--mute)}
.issues{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.issues li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;font-size:14px;align-items:start}
.issues li i{width:10px;height:10px;border-radius:50%;margin-top:6px}
.issues .error i{background:var(--err)}
.issues .warn i{background:var(--out)}
.issues .info i{background:var(--rule)}
.issues .ok i{background:var(--okc)}
.issues .btn{margin-top:6px;height:32px;font-size:13.5px}
.rounds{display:grid;gap:6px;margin:8px 0}
.round{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:14px}
.round b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:17px;width:26px}
.cls{display:inline-flex;gap:3px;padding:2px 8px;border-radius:6px;background:var(--sunk);font-family:var(--serif);font-style:italic;font-size:16px}
.task{background:var(--sunk);border-radius:12px;padding:14px;margin-bottom:14px}
.task h2{font-size:21px}
.pass{color:var(--okc);font-weight:600}
.failc{color:var(--err);font-weight:600}
.score{font-size:15px;margin:10px 0}
.score b{font-size:20px}
.tests td .inp{height:32px;font-size:15px}
.tests{table-layout:fixed}
.tests td{padding:5px 3px}
.tests th{padding:6px 3px}
.tests .inp{width:100%}
.tests td:nth-child(3){font-family:var(--mono);font-size:14px;color:var(--out);overflow-wrap:anywhere}
.tests .x{width:26px}
.ref h3:first-child{margin-top:0}
.ref table{margin:6px 0 12px}

/* ---------- Bänder ---------- */
#dock{grid-area:dock;background:var(--chrome);border-top:1px solid var(--rule);padding:10px 14px 12px;display:grid;gap:8px}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl label{font-size:13.5px;color:var(--mute)}
#word{height:38px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);padding:0 10px;font:500 16px var(--mono);color:var(--in);width:200px}
#word:focus{outline:none;border-color:var(--in);box-shadow:0 0 0 3px var(--in-soft)}
.pb{width:38px;height:38px;border:1px solid var(--rule);background:var(--paper);border-radius:8px;display:grid;place-items:center;color:var(--ink)}
.pb:hover{background:var(--sunk)}
.pb:disabled{opacity:.35;cursor:default}
.pb.play{background:var(--in);border-color:var(--in);color:#fff;width:46px}
.pb svg{width:18px;height:18px}
.speed{display:flex;align-items:center;gap:6px;margin-left:4px}
.speed input{width:90px;accent-color:var(--in)}
.speed output{font-size:13px;color:var(--mute);width:34px;font-variant-numeric:tabular-nums}
.formula{margin-left:auto;font-family:var(--serif);font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.formula .m{color:var(--mute);font-family:var(--sans);font-size:13.5px}
.tapes{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;align-items:center}
.tapes>span{font-size:13px;color:var(--mute)}
.tape{display:flex;gap:0;overflow-x:auto;padding:12px 2px 2px;scrollbar-width:thin;position:relative}
.cellt{flex:none;min-width:38px;height:38px;padding:0 8px;display:grid;place-items:center;font:500 16px var(--mono);border:1.5px solid;margin-right:-1.5px;position:relative;background:var(--paper)}
.tape.tin .cellt{border-color:color-mix(in srgb,var(--in) 55%,var(--rule));color:var(--in)}
.tape.tout .cellt{border-color:color-mix(in srgb,var(--out) 55%,var(--rule));color:var(--out)}
.tape.tin .cellt.done{background:var(--in-soft)}
.tape.tin .cellt.cur{border-color:var(--in);z-index:1;box-shadow:0 0 0 2px var(--in)}
.tape.tin .cellt.cur::before{content:"";position:absolute;top:-11px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--in)}
.tape.tin .cellt.bad{color:var(--err);border-color:var(--err);background:color-mix(in srgb,var(--err) 9%,transparent)}
.tape.tout .cellt.empty{color:transparent;border-style:dashed}
.tape.tout .cellt.fresh{animation:pop .35s ease-out}
.tape.tout .cellt.init{background:var(--out-soft)}
@keyframes pop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.status{font-size:13.5px;color:var(--mute)}
.status.bad{color:var(--err)}
.status.done{color:var(--okc)}

/* ---------- Dialog, Toast ---------- */
#dlg{border:0;border-radius:14px;padding:0;width:min(720px,calc(100vw - 24px));max-height:calc(100% - 40px);background:var(--chrome);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
#dlg::backdrop{background:rgba(10,12,16,.45)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.dlg-h h2{margin:0;font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:-.01em}
.dlg-b{padding:6px 18px 18px;overflow:auto;max-height:calc(100vh - 140px)}
.dlg-b pre{font:13px/1.55 var(--mono);background:var(--sunk);border-radius:10px;padding:12px;max-height:340px;overflow:auto;white-space:pre}
.dlg-b textarea{width:100%;min-height:240px;font:13px/1.5 var(--mono);background:var(--sunk);border:1px solid var(--rule);border-radius:10px;padding:12px;resize:vertical}
.keys{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 16px;font-size:14.5px}
kbd{font:12.5px var(--mono);border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:2px 6px;background:var(--paper);white-space:nowrap}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14.5px;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- schmal ---------- */
@media (max-width:1100px){main{grid-template-columns:52px minmax(0,1fr) 330px}.formula{display:none}}
@media (max-width:820px){
  .menus,.hide-narrow{display:none}
  .only-narrow{display:inline-flex}
  main{grid-template-columns:minmax(0,1fr);grid-template-areas:"canvas" "dock"}
  #stage{border-radius:0}
  #tools{position:absolute;left:10px;top:62px;z-index:12;flex-direction:row;padding:4px;border-radius:12px;gap:2px}
  #tools .tsep{width:1px;height:24px;margin:0 3px}
  #tools .k{display:none}
  .chip-stat{top:auto;bottom:12px}
  #panel{position:fixed;left:0;right:0;bottom:0;height:72%;z-index:50;border-left:0;border-radius:16px 16px 0 0;box-shadow:0 -20px 50px -10px rgba(0,0,0,.4);transform:translateY(105%);transition:transform .25s}
  #app.panel-open #panel{transform:none}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0}
  .sheet-head b{font-weight:500}
  #word{width:100%;flex:1 1 100px}
  .ctl label{display:none}
  .pb{width:36px}
  .pb.play{width:42px}
  .status{flex-basis:100%}
  .ctl{gap:5px}
  .speed{display:none}
  .dd{left:8px!important;right:8px;top:48px;max-height:calc(100vh - 70px);overflow:auto}
  .brand b{font-size:20px}
  .cols2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:420px){.brand .sub{display:none}.seg button{padding:0 9px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>

    </div>

<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".json,.txt,.mealy" hidden>
<script>
// ===== Transduktor: Kernlogik (ohne DOM) =====
const Core = (() => {
  let ctr = 0;
  const uid = p => p + (Date.now() % 1e6).toString(36) + (ctr++).toString(36) + Math.random().toString(36).slice(2, 5);
  const uniq = a => [...new Set(a)];
  const EPS = 'ε';

  function blank(type = 'mealy') {
    return { v: 1, type, name: type === 'mealy' ? 'Neuer Mealy-Automat' : 'Neuer Moore-Automat',
      states: [], start: null, trans: [], sigmaDecl: [], omegaDecl: [], bends: {}, tests: [], task: null };
  }
  function normalize(m) {
    const b = blank(m && m.type === 'moore' ? 'moore' : 'mealy');
    const r = Object.assign(b, m || {});
    r.states = (r.states || []).map(s => ({ id: String(s.id), name: String(s.name), x: +s.x || 0, y: +s.y || 0, out: s.out == null ? '' : String(s.out) }));
    r.trans = (r.trans || []).map(t => ({ id: String(t.id || uid('t')), from: String(t.from), to: String(t.to), inp: String(t.inp ?? ''), out: String(t.out ?? '') }))
      .filter(t => r.states.some(s => s.id === t.from) && r.states.some(s => s.id === t.to));
    r.sigmaDecl = uniq((r.sigmaDecl || []).map(String));
    r.omegaDecl = uniq((r.omegaDecl || []).map(String));
    r.bends = r.bends || {};
    r.tests = (r.tests || []).map(t => ({ w: String(t.w || ''), exp: String(t.exp || '') }));
    if (r.start && !r.states.some(s => s.id === r.start)) r.start = r.states[0]?.id || null;
    return r;
  }
  const st = (m, id) => m.states.find(s => s.id === id);
  const sname = (m, id) => st(m, id)?.name ?? '?';
  const sigma = m => uniq([...m.sigmaDecl, ...m.trans.map(t => t.inp).filter(Boolean)]);
  const omega = m => uniq([...m.omegaDecl, ...(m.type === 'mealy' ? m.trans.map(t => t.out) : m.states.map(s => s.out)).filter(Boolean)]);
  const trOf = (m, sid, a) => m.trans.filter(t => t.from === sid && t.inp === a);
  const isSingle = list => list.length > 0 && list.every(s => [...s].length === 1);

  function freeName(m, prefix = 'q') {
    for (let i = 0; ; i++) if (!m.states.some(s => s.name === prefix + i)) return prefix + i;
  }

  // Wort in Zeichen zerlegen: mit Trennzeichen splitten, sonst längste Übereinstimmung mit dem Alphabet
  function tokenize(alpha, word) {
    word = String(word || '').trim();
    if (!word) return [];
    if (/[\s,;]/.test(word) && !isSingle(alpha)) return word.split(/[\s,;]+/).filter(Boolean);
    if (/[\s,;]/.test(word)) word = word.replace(/[\s,;]+/g, '');
    const syms = [...alpha].sort((a, b) => b.length - a.length);
    const out = []; let i = 0;
    while (i < word.length) {
      const hit = syms.find(s => s && word.startsWith(s, i));
      if (hit) { out.push(hit); i += hit.length; }
      else { const ch = [...word.slice(i)][0]; out.push(ch); i += ch.length; }
    }
    return out;
  }

  function run(m, tokens) {
    const res = { steps: [], stop: null, startOut: null };
    let cur = m.start;
    if (!cur || !st(m, cur)) { res.stop = { at: 0, reason: 'nostart' }; return res; }
    if (m.type === 'moore') res.startOut = st(m, cur).out;
    const S = new Set(sigma(m));
    for (let i = 0; i < tokens.length; i++) {
      const a = tokens[i];
      if (!S.has(a)) { res.stop = { at: i, reason: 'symbol', sym: a, state: cur }; break; }
      const t = trOf(m, cur, a)[0];
      if (!t) { res.stop = { at: i, reason: 'missing', sym: a, state: cur }; break; }
      const out = m.type === 'mealy' ? t.out : st(m, t.to).out;
      res.steps.push({ from: cur, to: t.to, inp: a, out, tid: t.id });
      cur = t.to;
    }
    return res;
  }
  const outputs = (m, res) => m.type === 'moore' ? (res.startOut == null ? [] : [res.startOut, ...res.steps.map(s => s.out)]) : res.steps.map(s => s.out);
  const joinSyms = (alpha, arr) => arr.join(isSingle(alpha) ? '' : ' ');

  function reachable(m) {
    const seen = new Set(); if (!m.start) return seen;
    const q = [m.start]; seen.add(m.start);
    while (q.length) { const c = q.shift(); for (const t of m.trans) if (t.from === c && !seen.has(t.to)) { seen.add(t.to); q.push(t.to); } }
    return seen;
  }

  function validate(m) {
    const issues = []; const S = sigma(m); const missing = [];
    const add = (level, code, text, extra = {}) => issues.push({ level, code, text, ...extra });
    if (!m.states.length) add('info', 'empty', 'Noch keine Zustände. Doppelklick auf die Fläche legt einen an.');
    if (m.states.length && !m.start) add('error', 'nostart', 'Kein Startzustand festgelegt.');
    const names = m.states.map(s => s.name);
    uniq(names.filter((n, i) => names.indexOf(n) !== i)).forEach(n => add('error', 'dupname', `Der Name „${n}“ kommt mehrfach vor.`));
    if (m.states.length && !S.length) add('info', 'nosigma', 'Das Eingabealphabet Σ ist leer.');
    let dupCount = 0;
    for (const s of m.states) for (const a of S) {
      const ts = trOf(m, s.id, a);
      if (ts.length > 1) { dupCount++; add('error', 'nondet', `δ(${s.name}, ${a}) ist ${ts.length}-mal belegt. Pro Zustand und Zeichen darf es nur eine Kante geben.`, { sid: s.id, sym: a }); }
      if (!ts.length) missing.push({ sid: s.id, sym: a });
    }
    if (missing.length) add('warn', 'missing', `${missing.length} ${missing.length === 1 ? 'Kante fehlt' : 'Kanten fehlen'}: ` +
      missing.slice(0, 6).map(x => `δ(${sname(m, x.sid)}, ${x.sym})`).join(', ') + (missing.length > 6 ? ' …' : ''), { fix: 'loops' });
    if (m.type === 'mealy') {
      const noOut = m.trans.filter(t => !t.out);
      if (noOut.length) add('error', 'noout', `${noOut.length} ${noOut.length === 1 ? 'Kante hat' : 'Kanten haben'} keine Ausgabe.`);
    } else {
      const noOut = m.states.filter(s => !s.out);
      if (noOut.length) add('error', 'noout', `Ohne Ausgabe: ${noOut.map(s => s.name).join(', ')}. Bei Moore braucht jeder Zustand eine.`);
    }
    const noInp = m.trans.filter(t => !t.inp);
    if (noInp.length) add('error', 'noinp', `${noInp.length} ${noInp.length === 1 ? 'Kante hat' : 'Kanten haben'} kein Eingabezeichen.`);
    const R = reachable(m);
    const unreach = m.states.filter(s => !R.has(s.id));
    if (m.start && unreach.length) add('info', 'unreach', `Nicht erreichbar vom Start: ${unreach.map(s => s.name).join(', ')}.`, { fix: 'unreach' });
    const usedOut = new Set((m.type === 'mealy' ? m.trans.map(t => t.out) : m.states.map(s => s.out)));
    const unusedO = omega(m).filter(o => !usedOut.has(o));
    if (unusedO.length) add('info', 'unusedOmega', `In Ω, aber nie ausgegeben: ${unusedO.join(', ')}.`);
    const needed = m.states.length * S.length;
    const have = m.trans.length;
    const det = !dupCount && !noInp.length;
    const complete = needed > 0 && !missing.length;
    if (det && complete && !issues.some(i => i.level === 'error')) add('ok', 'ok', `Vollständig und deterministisch: ${needed} von ${needed} Kanten.`);
    return { issues, missing, needed, have, det, complete, unreach };
  }

  // ---------- Text-Kurzschreibweise ----------
  const NAME = /^[^\s,\/:>{}()#]+$/;
  function toText(m) {
    const L = [];
    L.push(`# ${m.name || 'Automat'}`);
    L.push(`typ ${m.type}`);
    L.push(`eingabe: ${sigma(m).join(' ')}`);
    L.push(`ausgabe: ${omega(m).join(' ')}`);
    if (m.start) L.push(`start ${sname(m, m.start)}`);
    for (const s of m.states) L.push(m.type === 'moore' ? `zustand ${s.name} / ${s.out}` : `zustand ${s.name}`);
    const groups = new Map();
    for (const t of m.trans) { const k = t.from + '>' + t.to; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); }
    for (const ts of groups.values()) {
      const lab = ts.map(t => m.type === 'mealy' ? `${t.inp}/${t.out}` : t.inp).join(', ');
      L.push(`${sname(m, ts[0].from)} -> ${sname(m, ts[0].to)} : ${lab}`);
    }
    return L.join('\n') + '\n';
  }

  function parseText(text, prev) {
    const errors = []; const lines = String(text).split(/\r?\n/);
    let type = prev?.type || 'mealy';
    for (const raw of lines) { const mm = raw.trim().match(/^(typ|type)\s+(mealy|moore)\s*$/i); if (mm) type = mm[2].toLowerCase(); }
    const m = blank(type); m.name = prev?.name || m.name;
    m.tests = prev?.tests ? JSON.parse(JSON.stringify(prev.tests)) : []; m.task = prev?.task || null;
    const byName = new Map();
    const ensure = (name, ln) => {
      if (!NAME.test(name)) { errors.push({ line: ln, msg: `„${name}“ ist kein gültiger Zustandsname.` }); return null; }
      if (byName.has(name)) return byName.get(name);
      const old = prev?.states.find(s => s.name === name);
      const s = { id: old?.id || uid('s'), name, x: old ? old.x : NaN, y: old ? old.y : NaN, out: old?.out || '' };
      if (m.type === 'mealy') s.out = '';
      m.states.push(s); byName.set(name, s); return s;
    };
    let startName = null; let firstComment = true;
    lines.forEach((raw, i) => {
      const ln = i + 1; let line = raw.trim();
      if (!line) return;
      if (line.startsWith('#')) { if (firstComment && line.slice(1).trim()) { m.name = line.slice(1).trim(); } firstComment = false; return; }
      firstComment = false;
      let r;
      if ((r = line.match(/^(typ|type)\s+(mealy|moore)$/i))) return;
      if ((r = line.match(/^name\s*[:=]\s*(.+)$/i))) { m.name = r[1].trim(); return; }
      if ((r = line.match(/^start\s*[:=]?\s*(\S+)$/i))) { startName = r[1]; ensure(r[1], ln); return; }
      if ((r = line.match(/^(eingabe|sigma|Σ)\s*[:=]\s*(.*)$/i))) { m.sigmaDecl = uniq(r[2].split(/[\s,{}]+/).filter(Boolean)); return; }
      if ((r = line.match(/^(ausgabe|omega|Ω)\s*[:=]\s*(.*)$/i))) { m.omegaDecl = uniq(r[2].split(/[\s,{}]+/).filter(Boolean)); return; }
      if ((r = line.match(/^(zustand|state)\s+([^\s\/]+)(?:\s*\/\s*(\S+))?$/i))) {
        const s = ensure(r[2], ln); if (!s) return;
        if (r[3] != null) { if (type === 'mealy') errors.push({ line: ln, msg: 'Bei Mealy steht die Ausgabe an der Kante, nicht im Zustand.' }); else s.out = r[3]; }
        return;
      }
      if ((r = line.match(/^(\S+?)\s*-+>\s*([^\s:]+)\s*:\s*(.+)$/))) {
        const a = ensure(r[1], ln), b = ensure(r[2], ln); if (!a || !b) return;
        for (const part of r[3].split(',').map(x => x.trim()).filter(Boolean)) {
          if (type === 'mealy') {
            const pp = part.split('/').map(x => x.trim());
            if (pp.length !== 2 || !pp[0] || !pp[1]) { errors.push({ line: ln, msg: `„${part}“: Mealy-Kanten schreibt man als Eingabe/Ausgabe, z. B. 1/n.` }); continue; }
            m.trans.push({ id: uid('t'), from: a.id, to: b.id, inp: pp[0], out: pp[1] });
          } else {
            if (part.includes('/')) { errors.push({ line: ln, msg: `„${part}“: Moore-Kanten tragen nur das Eingabezeichen.` }); continue; }

  textTimer = setTimeout(() => {
    const { model: m, errors } = C.parseText(ta.value, model);
    textErrors = errors; renderTextErrors();
    if (errors.length) return;
    C.placeMissing(m);
    const before = JSON.stringify(model);
    const keep = { ...m };
    if (JSON.stringify(C.toText(m)) === JSON.stringify(C.toText(model))) return;
    undoS.push(before); redoS = []; model = C.normalize(keep); sel = null; closePop();
    recompute(); renderCanvas(); renderSim(); renderTabs(); renderHeader(); persist();
  }, 450);
}
function pPruefen() {

  <div class="stats"><div class="stat"><b>${v.have}<span style="font-size:15px;color:var(--mute)"> / ${v.needed}</span></b><span>Kanten</span></div>
  <div class="stat"><b class="${v.complete ? 'pass' : 'failc'}">${v.complete ? 'ja' : 'nein'}</b><span>vollständig</span></div>
  <div class="stat"><b class="${!nondet && v.det ? 'pass' : 'failc'}">${!nondet && v.det ? 'ja' : 'nein'}</b><span>deterministisch</span></div></div>

  html += `<h3>${mealy ? 'In Moore umwandeln' : 'In Mealy umwandeln'}</h3>
  <p class="mut">${mealy ? 'Jeder neue Zustand ist ein Paar (Zustand, zuletzt ausgegebenes Zeichen). Der Start bekommt ε, weil noch nichts ausgegeben wurde. Das Ausgabewort wird dadurch ein Zeichen länger.' : 'Die Ausgabe des Zielzustands wandert auf jede eingehende Kante: λ(q, a) = λ(δ(q, a)). Die Zustände bleiben gleich.'}</p>
  <button class="btn pri" data-x="convert">${mealy ? 'In Moore umwandeln' : 'In Mealy umwandeln'}</button>`;
  if (conv && conv.forName === m.name && conv.mapping?.length && m.type === 'moore') html += `<details class="box" open><summary>Zuordnung der neuen Zustände</summary><div class="tbl-wrap"><table class="t"><thead><tr><th>neu</th><th>Paar</th></tr></thead><tbody>${conv.mapping.map(r => `<tr><td>${nameHTML(r.name)}</td><td>(${nameHTML(r.from)}, <span class="sym-o">${esc(r.out)}</span>)</td></tr>`).join('')}</tbody></table></div></details>`;
  html += `<h3>Minimieren</h3><p class="mut">Zustände, die sich bei jedem Eingabewort gleich verhalten, werden zusammengelegt. Erst nach ${mealy ? 'den Ausgaben pro Eingabezeichen' : 'der Ausgabe'} trennen, dann so lange verfeinern, bis sich nichts mehr ändert.</p>`;
  if (!minPrev) html += `<button class="btn" data-x="minprev">Minimierung berechnen</button>`;
  else if (!minPrev.ok) html += `<p class="failc" style="font-weight:400">${esc(minPrev.reason)}</p>`;
  else {
    html += `<div class="rounds">${minPrev.rounds.map((r, k) => `<div class="round"><b>P${k}</b>${r.map(c => `<span class="cls">{${c.map(nameHTML).join(', ')}}</span>`).join('')}</div>`).join('')}<div class="round mut"><b>P${minPrev.rounds.length}</b>= P${minPrev.rounds.length - 1}, keine Klasse zerfällt weiter. Fertig.</div></div>
    <p>${minPrev.after === minPrev.before ? `Schon minimal: ${minPrev.after} Zustände.` : `Von ${minPrev.before} auf ${minPrev.after} Zustände.`}${minPrev.removedUnreach ? ` Dabei fallen ${minPrev.removedUnreach} unerreichbare weg.` : ''}</p>
    ${minPrev.after < minPrev.before ? '<button class="btn pri" data-x="minapply">Minimalen Automaten übernehmen</button>' : ''}`;

}
function testResults() {
  const O = C.omega(model);
  return (model.tests || []).map(t => {
    const toks = C.tokenize(C.sigma(model), t.w); const r = C.run(model, toks);
    const out = r.stop ? null : C.joinSyms(O, C.outputs(model, r));
    const norm = s => C.isSingle(O) || !O.length ? String(s).replace(/[\s,;]+/g, '') : String(s).trim().split(/[\s,;]+/).join(' ');
    return { ...t, out, stop: r.stop, ok: out != null && t.exp !== '' && norm(out) === norm(t.exp) };
  });
}
function pTests() {
  const tr = testResults(); const task = model.task ? TASKS.find(t => t.id === model.task) : null;
  const withExp = tr.filter(r => r.exp); const passed = withExp.filter(r => r.ok).length;
  let html = '';
  if (task) html += `<div class="task"><h2>${esc(task.title)}</h2><p>${esc(task.text)}</p><p class="mut">${task.type === 'mealy' ? 'Mealy' : 'Moore'}, Σ = {${task.sigma.map(esc).join(', ')}}, Ω = {${task.omega.map(esc).join(', ')}}</p>
    <div class="brow"><button class="btn" data-x="solution">Lösung zeigen</button><button class="btn" data-x="leavetask">Aufgabe verlassen</button></div></div>`;
  else html += `<h2>Tests</h2><p class="mut">Lege Eingabewörter mit der erwarteten Ausgabe an. Jede Änderung am Automaten prüft alles neu.</p>`;
  if (withExp.length) html += `<p class="score"><b class="${passed === withExp.length ? 'pass' : 'failc'}">${passed} von ${withExp.length}</b> bestanden${passed === withExp.length && task ? '. Aufgabe gelöst.' : ''}</p>`;
  html += `<div class="tbl-wrap"><table class="t tests"><colgroup><col style="width:27%"><col style="width:27%"><col><col style="width:22px"><col style="width:54px"></colgroup><thead><tr><th>Eingabe</th><th>erwartet</th><th>Ausgabe</th><th class="c"></th><th></th></tr></thead><tbody>
  ${tr.map((r, k) => `<tr><td><input class="inp sm i" data-tw="${k}" value="${esc(r.w)}" spellcheck="false" aria-label="Eingabewort ${k + 1}" style="font-family:var(--mono)"></td>
    <td><input class="inp sm o" data-te="${k}" value="${esc(r.exp)}" spellcheck="false" aria-label="erwartete Ausgabe ${k + 1}" style="font-family:var(--mono)"></td>
    <td>${r.stop ? '<span class="failc" style="font-family:var(--sans);font-size:13px" title="Der Automat bleibt bei diesem Wort stehen">Stopp</span>' : esc(r.out)}</td>
    <td class="c">${r.exp ? (r.ok ? '<span class="pass" aria-label="bestanden">✓</span>' : '<span class="failc" aria-label="falsch">✗</span>') : ''}</td>
    <td style="white-space:nowrap"><button class="x" data-tload="${k}" title="Im Simulator abspielen" aria-label="Abspielen">▸</button><button class="x" data-trm="${k}" aria-label="Test löschen">×</button></td></tr>`).join('')}
  </tbody></table></div>
  <div class="brow" style="margin-top:10px"><button class="btn" data-x="addtest">${ICON.plus} Test</button><button class="btn" data-x="curtest">Aktuelles Wort als Test</button>${tr.some(r => !r.exp && r.out != null) ? '<button class="btn" data-x="fillexp">Leere Erwartungen füllen</button>' : ''}</div>`;
  if (!task) html += `<p class="mut" style="margin-top:16px">Fertige Übungen mit automatischer Kontrolle findest du im Menü Aufgaben.</p>`;
  return html;
}
function pAblauf() {
  const res = sim.res; if (!res || !sim.tokens.length) return '<h2>Ablauf</h2><p class="mut">Gib unten ein Eingabewort ein. Hier erscheint dann jeder Schritt mit δ und λ.</p>';
  const mealy = model.type === 'mealy'; const O = C.omega(model);
  const rows = res.steps.map((s, k) => `<tr class="${k === sim.i - 1 ? 'cur' : ''}" data-goto="${k + 1}" style="cursor:pointer"><td>${k + 1}</td><td>${nameHTML(C.sname(model, s.from))}</td><td class="sym-i">${esc(s.inp)}</td><td class="sym-o">${esc(s.out)}</td><td>${nameHTML(C.sname(model, s.to))}</td></tr>`).join('');
  const stop = res.stop && res.stop.reason !== 'nostart' ? `<tr class="stop"><td>${res.stop.at + 1}</td><td>${nameHTML(C.sname(model, res.stop.state))}</td><td class="sym-i">${esc(res.stop.sym)}</td><td colspan="2">${res.stop.reason === 'symbol' ? 'nicht in Σ' : 'keine Kante'}</td></tr>` : '';
  return `<h2>Ablauf</h2><p class="mut">Klick auf eine Zeile springt zu diesem Schritt.${mealy ? '' : ' Moore gibt schon im Startzustand etwas aus.'}</p>
  <div class="tbl-wrap"><table class="t"><thead><tr><th>#</th><th>Zustand</th><th>liest</th><th>gibt aus</th><th>neu</th></tr></thead><tbody>
  ${!mealy && res.startOut != null ? `<tr class="${sim.i === 0 ? 'cur' : ''}" data-goto="0" style="cursor:pointer"><td>0</td><td>${nameHTML(C.sname(model, model.start))}</td><td>–</td><td class="sym-o">${esc(res.startOut)}</td><td></td></tr>` : ''}${rows}${stop}</tbody></table></div>
  <p style="margin-top:12px">Ausgabewort: <b class="sym-o" style="font-family:var(--mono)">${esc(C.joinSyms(O, C.outputs(model, res))) || 'leer'}</b> <span class="mut">(Länge ${C.outputs(model, res).length} bei ${sim.tokens.length} Eingabezeichen)</span></p>`;
}

    const sid = el.dataset.cell, a = el.dataset.sym, to = el.value;
    change(m => {
      const old = C.trOf(m, sid, a); const out = old[0]?.out || (m.type === 'mealy' ? C.omega(m)[0] || '' : '');
      m.trans = m.trans.filter(t => !(t.from === sid && t.inp === a));

$('#pbody').addEventListener('click', e => {
  const b = e.target.closest('button,[data-selstate],[data-goto]'); if (!b) return;
  if (b.dataset.rm) { const k = b.dataset.rm === 'sigma' ? 'sigmaDecl' : 'omegaDecl'; const s = b.dataset.sym; change(m => { m[k] = m[k].filter(x => x !== s); }); renderPanel(true); return; }

  if (b.dataset.trm != null) { change(m => { m.tests.splice(+b.dataset.trm, 1); }); renderPanel(true); return; }

    change(m => { for (const mi of v.missing) m.trans.push({ id: C.uid('t'), from: mi.sid, to: mi.sid, inp: mi.sym, out: m.type === 'mealy' ? o : '' }); });

  if (x === 'curtest') { if (!sim.word) return toast('Erst unten ein Eingabewort eintippen.'); const out = sim.res.stop ? '' : C.joinSyms(C.omega(model), C.outputs(model, sim.res)); change(m => { m.tests.push({ w: sim.word, exp: out }); }); renderPanel(true); }

function freeSpot() {
  if (!model.states.length) return { x: 0, y: 0 };
  const xs = model.states.map(s => s.x), ys = model.states.map(s => s.y);
  return { x: Math.max(...xs) + 150, y: Math.round(ys.reduce((a, b) => a + b, 0) / ys.length / 12) * 12 };
}
function doLayoutQuiet() { C.layoutForce(model); recompute(); renderAll(); persist(); requestAnimationFrame(fitView); }
function tupleLatex() {
  const m = model, S = C.sigma(m), O = C.omega(m);
  const set = l => '\\{' + l.map(x => '\\mathsf{' + x.replace(/[_$&#%{}]/g, '\\$&').replace('ε', '\\varepsilon') + '}').join(', ') + '\\}';
  return `M = (Q, \\Sigma, \\Omega, \\delta, \\lambda, ${C.texName(C.sname(m, m.start) || 'q0')})\\\\\nQ = \\{${m.states.map(s => C.texName(s.name)).join(', ')}\\},\\quad \\Sigma = ${set(S)},\\quad \\Omega = ${set(O)}\\\\\n\\delta\\colon Q \\times \\Sigma \\to Q,\\quad \\lambda\\colon ${m.type === 'mealy' ? 'Q \\times \\Sigma' : 'Q'} \\to \\Omega`;
}
function convertType() {
  if (!model.states.length) { change(m => { m.type = m.type === 'mealy' ? 'moore' : 'mealy'; m.name = m.type === 'mealy' ? 'Neuer Mealy-Automat' : 'Neuer Moore-Automat'; }); return; }
  if (model.type === 'mealy') {
    const r = C.mealyToMoore(model); conv = { forName: r.model.name, mapping: r.mapping };
    setModel(r.model); doLayoutQuiet(); toast(`In Moore umgewandelt: ${r.model.states.length} Zustände`);
  } else {
    const r = C.mooreToMealy(model); conv = null; setModel(r.model); toast('In Mealy umgewandelt. Zustände bleiben gleich.');
  }
  tab = 'pruefen'; renderTabs(); renderPanel(true);
}

function fromDSL(text, pos, bends) {
  const { model: m } = C.parseText(text, null);
  const byName = n => m.states.find(s => s.name === n)?.id;
  if (pos) for (const s of m.states) if (pos[s.name]) { s.x = pos[s.name][0]; s.y = pos[s.name][1]; }
  if (bends) for (const [k, v] of Object.entries(bends)) {
    if (k.startsWith('loop:')) { const id = byName(k.slice(5)); if (id) m.bends['loop:' + id] = v; }
    else { const [a, b] = k.split('>'); if (byName(a) && byName(b)) m.bends[byName(a) + '>' + byName(b)] = v; }
  }
  C.placeMissing(m); return m;
}
function loadExample(id) {
  const ex = EXAMPLES.find(x => x.id === id); const m = fromDSL(ex.text, ex.pos, ex.bends);
  m.tests = (ex.tests || []).map(t => ({ ...t }));
  conv = null; setModel(m); setWord(ex.word); requestAnimationFrame(fitView); toast(`Beispiel: ${ex.title}`);
}
function loadTask(id) {
  const t = TASKS.find(x => x.id === id); const ref = fromDSL(t.ref); ref.sigmaDecl = t.sigma; ref.omegaDecl = t.omega;
  const m = C.blank(t.type); m.name = t.title; m.sigmaDecl = [...t.sigma]; m.omegaDecl = [...t.omega]; m.task = t.id;
  m.tests = t.words.map(w => ({ w, exp: C.joinSyms(C.omega(ref), C.outputs(ref, C.run(ref, C.tokenize(C.sigma(ref), w)))) }));

// ---------- Eingabewort, Abspielen ----------
function setWord(w) { sim.word = w; $('#word').value = w; stopPlay(); sim.i = 0; recompute(); renderSim(); persist(); }

$('#sPlay').addEventListener('click', () => sim.playing ? stopPlay() : play());

$('#sBack').addEventListener('click', () => { stopPlay(); sim.i = Math.max(0, sim.i - 1); renderSim(); });

// ---------- Tastatur ----------
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return; }
  if (typing || mod || $('#dlg').open) return;
  const k = e.key;
  if (k === 'Escape') { closeMenu(); closePop(); pendingFrom = null; sel = null; $('#app').classList.remove('panel-open'); renderCanvas(); return; }
  if (k === 'Delete' || k === 'Backspace') { if (sel) { e.preventDefault(); deleteSel(); } return; }
  const map = { v: () => setTool('select'), z: () => setTool('state'), k: () => setTool('edge'), x: () => setTool('delete'), l: () => doLayout('force'), f: fitView, '?': showKeys,
    ' ': () => sim.playing ? stopPlay() : play(), ArrowRight: stepOnce, ArrowLeft: () => { stopPlay(); sim.i = Math.max(0, sim.i - 1); renderSim(); },
    Home: () => { stopPlay(); sim.i = 0; renderSim(); }, End: () => { stopPlay(); sim.i = sim.res.steps.length; renderSim(); } };
  const f = map[k] || map[k.toLowerCase()];
  if (f) { e.preventDefault(); f(); }
});

function openDlg(title, html) { $('#dlgT').textContent = title; $('#dlgB').innerHTML = html; const d = $('#dlg'); if (!d.open) { try { d.showModal(); } catch (e) { d.setAttribute('open', ''); } } }

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
async function copy(text, msg = 'Kopiert') {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); toast(ok ? msg : 'Kopieren ging nicht. Markier den Text von Hand.'); }
}
let dlNs = null; const dlReady = window.claude?.use ? Promise.resolve(window.claude.use('downloads')).then(n => (dlNs = n)).catch(() => null) : null;
async function download(name, data, type) {
  if (dlReady) {
    const ns = dlNs || await dlReady;
    if (ns) {
      try { await ns.save({ filename: name.replace(/\.tex$/, '.txt'), data }); toast('Gespeichert'); }
      catch (e) { if (e?.code !== 'declined') toast('Speichern ging hier nicht. Nimm Kopieren.'); }
      return;
    }
  }
  try { const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type })); const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); } catch (e) {}
}
const fileBase = () => (model.name || 'automat').toLowerCase().replace(/[^a-z0-9äöüß]+/gi, '-').replace(/^-|-$/g, '') || 'automat';

}
function exportJSON() { exportDlg('Speichern', JSON.stringify(model, null, 1), fileBase() + '.json', 'application/json', 'Diese Datei kannst du später über Datei → Öffnen wieder laden.'); }
function exportTikz() { exportDlg('TikZ für LaTeX', C.toTikz(model), fileBase() + '.tex', 'text/plain', 'Passt zum Stil der Übersicht. Im Dokument braucht es tikz mit den Bibliotheken automata und arrows.meta.'); }
const EXPORT_CSS = `.st-c{fill:#fff;stroke:#14171c;stroke-width:1.6}.st-n{font-family:'Crimson Pro',Georgia,serif;font-style:italic;font-size:21px;fill:#14171c;text-anchor:middle}.st-n .sub{font-style:normal;font-size:14px}.st-o{font-family:'Fira Sans',Arial,sans-serif;font-weight:500;font-size:14px;fill:#d9441b;text-anchor:middle}.st-div{stroke:#dde1e6;stroke-width:1.2}.st-start{stroke:#14171c;stroke-width:1.6;fill:none}.ed-p{fill:none;stroke:#14171c;stroke-width:1.5}.lb-bg{fill:#fff}.lb text{font-family:'Fira Sans',Arial,sans-serif;font-size:15px;font-weight:500;text-anchor:middle}.lb .i{fill:#2457c5}.lb .o{fill:#d9441b}.lb .s{fill:#5b6472;font-weight:400}.lb .miss{fill:#b0123e}`;
function buildSVG() {
  const b = bbox() || { x0: 0, y0: 0, x1: 100, y1: 100 }; const pad = 16;
  const w = b.x1 - b.x0 + pad * 2, h = b.y1 - b.y0 + pad * 2;
  return { w, h, svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${(b.x0 - pad).toFixed(0)} ${(b.y0 - pad).toFixed(0)} ${w.toFixed(0)} ${h.toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}"><style>${EXPORT_CSS}</style><defs><marker id="ar" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="12" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L12,5 L0,9.5 L2.6,5 z" fill="#14171c"/></marker></defs><rect x="${(b.x0 - pad).toFixed(0)}" y="${(b.y0 - pad).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="#fff"/>${svgEdges(model, { export: true }).replace(/url\(#ar[SH]\)/g, 'url(#ar)')}${svgStates(model, { export: true })}</svg>` };

function exportSVG() { if (!model.states.length) return toast('Das Blatt ist leer.'); const { svg } = buildSVG(); exportDlg('Bild als SVG', svg, fileBase() + '.svg', 'image/svg+xml', 'Vektorgrafik, bleibt in Notability, Word oder LaTeX scharf.'); }
function exportPNG() {
  if (!model.states.length) return toast('Das Blatt ist leer.');
  const { svg, w, h } = buildSVG(); const img = new Image(); const sc = 3;
  img.onload = () => {

    const url = c.toDataURL('image/png');
    openDlg('Bild als PNG', `<p class="mut">Dreifache Auflösung. Falls Herunterladen hier gesperrt ist: Bild gedrückt halten oder Rechtsklick und „Bild speichern“.</p><img src="${url}" alt="Automat als Bild" style="max-width:100%;border:1px solid var(--rule);border-radius:10px;background:#fff"><div class="brow" style="margin-top:10px"><button class="btn pri" id="pngDl">Herunterladen</button></div>`);

// Link: JSON, wenn möglich komprimiert, als Hex (nur Buchstaben und Ziffern)
const hex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');
const unhex = s => new Uint8Array(s.match(/../g).map(h => parseInt(h, 16)));
async function pack(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream) { try { const s = new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw')); return 'z' + hex(new Uint8Array(await new Response(s).arrayBuffer())); } catch (e) {} }
  return 'r' + hex(raw);
}
async function unpack(str) {
  const kind = str[0], bytes = unhex(str.slice(1));
  if (kind === 'z') { const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return JSON.parse(await new Response(s).text()); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function shareLink() {
  const slim = { ...model, task: model.task }; const code = await pack({ m: slim, w: sim.word });
  const url = location.href.split('#')[0] + '#a' + code;
  openDlg('Link zum Teilen', `<p class="mut">Der ganze Automat steckt im Link, es wird nichts hochgeladen. Wer ihn öffnet, sieht genau diesen Stand. Am zuverlässigsten klappt das mit der Version auf GitHub Pages.</p><textarea readonly style="min-height:110px">${esc(url)}</textarea><div class="brow" style="margin-top:10px"><button class="btn pri" id="lnkCopy">Link kopieren</button></div>`);
  $('#lnkCopy').onclick = () => copy(url, 'Link kopiert');
}
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const txt = await f.text();
  try {
    let m;
    if (txt.trim().startsWith('{')) m = C.normalize(JSON.parse(txt));
    else { const r = C.parseText(txt, null); if (r.errors.length) throw new Error(`Zeile ${r.errors[0].line}: ${r.errors[0].msg}`); m = r.model; C.placeMissing(m); }
    setModel(m); requestAnimationFrame(fitView); toast(`Geöffnet: ${m.name}`);
  } catch (err) { toast('Datei ließ sich nicht lesen. ' + (err.message || '')); }
});

function showRef() {
  openDlg('Kurzreferenz', `<div class="cols2 ref"><div><h3>Mealy-Automat</h3><p class="tuple" style="font-size:22px;margin:4px 0 8px">M = (Q, <span class="sym-i">Σ</span>, <span class="sym-o">Ω</span>, δ, <span class="sym-o">λ</span>, q<sub>0</sub>)</p>
  <p>δ: Q × <span class="sym-i">Σ</span> → Q<br><span class="sym-o">λ</span>: Q × <span class="sym-i">Σ</span> → <span class="sym-o">Ω</span></p><p>Ausgabe an der Kante, geschrieben als <span class="sym-i">a</span> / <span class="sym-o">y</span>. Bei n Eingabezeichen kommen n Ausgabezeichen heraus.</p></div>
  <div><h3>Moore-Automat</h3><p class="tuple" style="font-size:22px;margin:4px 0 8px">M = (Q, <span class="sym-i">Σ</span>, <span class="sym-o">Ω</span>, δ, <span class="sym-o">λ</span>, q<sub>0</sub>)</p>
  <p>δ: Q × <span class="sym-i">Σ</span> → Q<br><span class="sym-o">λ</span>: Q → <span class="sym-o">Ω</span></p><p>Ausgabe im Zustand, geschrieben als q / <span class="sym-o">y</span>. Der Startzustand gibt schon aus, also n + 1 Zeichen. Manche Bücher zählen die erste Ausgabe nicht mit.</p></div></div>
  <h3>Woran man einen vollständigen Automaten erkennt</h3><p>Von jedem Zustand geht für jedes Zeichen aus Σ genau eine Kante ab. Das sind |Q| · |Σ| Kanten. Endzustände gibt es bei beiden nicht.</p>
  <h3>Umwandeln</h3><p>Moore → Mealy: Die Ausgabe des Zielzustands wird an jede eingehende Kante geschrieben, λ'(q, a) = λ(δ(q, a)).<br>Mealy → Moore: Neue Zustände sind Paare (q, y) aus Zustand und zuletzt ausgegebenem Zeichen. Der Moore-Automat hat dadurch oft mehr Zustände.</p>
  <h3>Minimieren</h3><p>Zuerst nach Ausgabeverhalten in Klassen teilen (P<sub>0</sub>). Dann Zustände trennen, deren Folgezustände in verschiedenen Klassen liegen (P<sub>1</sub>, P<sub>2</sub>, …), bis sich nichts mehr ändert. Jede Klasse wird ein Zustand.</p>
  <h3>Andere Schreibweisen</h3><p>Q auch Z oder S, Σ auch E oder X, Ω auch A, Y oder Γ, λ auch g oder ω, q<sub>0</sub> auch z<sub>0</sub>.</p>`);
}

// ---------- Start ----------
function snapshot() { return { model, word: sim.word, tab }; }
async function boot(data) {
  let loaded = false;
  const h = location.hash.slice(1);
  if (h.startsWith('a') && h.length > 4) { try { const d = await unpack(h.slice(1)); model = C.normalize(d.m); sim.word = d.w || ''; loaded = true; } catch (e) {} }
  if (!loaded && data && data.model) { model = C.normalize(data.model); sim.word = data.word || ''; tab = data.tab || tab; loaded = true; }
  if (!loaded) { try { const d = JSON.parse(localStorage.getItem(LS) || 'null'); if (d?.model?.states) { model = C.normalize(d.model); sim.word = d.word || ''; tab = d.tab || tab; loaded = true; } } catch (e) {} }
  if (!loaded) { const ex = EXAMPLES[0]; model = fromDSL(ex.text, ex.pos, ex.bends); model.tests = ex.tests.map(t => ({ ...t })); sim.word = ex.word; sim.i = 2; }
  C.placeMissing(model);
  $('#word').value = sim.word;
  ['bUndo', 'bRedo', 'bShare', 'bMenu', 'bPanel'].forEach(id => { $('#' + id).innerHTML = ICON[{ bUndo: 'undo', bRedo: 'redo', bShare: 'share', bMenu: 'menu', bPanel: 'panel' }[id]] + (id === 'bShare' ? '<span>Teilen</span>' : ''); });
  $('#zIn').innerHTML = ICON.plus; $('#zOut').innerHTML = ICON.minus; $('#zFit').innerHTML = ICON.fit;
  $('#sReset').innerHTML = ICON.reset; $('#sBack').innerHTML = ICON.back; $('#sStep').innerHTML = ICON.step; $('#sEnd').innerHTML = ICON.end;
  const keepI = sim.i; recompute(); sim.i = Math.min(keepI, sim.res.steps.length);
  updatePlayBtn(); renderAll(); fitView();
  new ResizeObserver(() => { placePop(); }).observe($('#stage'));
  let lastW = $('#stage').clientWidth;
  window.addEventListener('resize', () => { const w = $('#stage').clientWidth; if (Math.abs(w - lastW) > 80) { lastW = w; fitView(); } });
  window.claude?.hot?.snapshot?.(snapshot);
  if (document.fonts?.ready) document.fonts.ready.then(() => renderCanvas());
}
window.addEventListener('hashchange', () => { if (location.hash.startsWith('#a')) boot(null); });
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
window.__T = { get model() { return model; }, sim, C, setWord, play, loadExample, loadTask, fitView };
}
